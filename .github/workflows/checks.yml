name: Validación del prototipo
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dependencias para pruebas
        run: python -m pip install 'fastapi>=0.115,<1' 'httpx>=0.27,<1' 'numpy>=1.26,<3'
      - name: Pruebas de audio y protocolo WebSocket
        run: cd backend && python -m unittest discover -s tests -v
      - name: Sintaxis JavaScript
        run: for f in extension/*.js; do node --check "$f"; done
      - name: Validar manifest.json
        run: python -m json.tool extension/manifest.json > /dev/null
